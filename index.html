<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#020912" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#020912" />
  <meta name="color-scheme" content="dark" />

  <!-- Preconnect for critical resources -->
  <link rel="preconnect" href="https://api.aegisshare.io" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Critical fonts — display fonts loaded non-blocking -->
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/JetBrainsMono-Regular.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/PlusJakartaSans-Regular.woff2" crossorigin />

  <!-- Google Fonts — non-blocking with media trick -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" />
  </noscript>

  <!-- Critical inline CSS — prevents FOUC -->
  <style>
    :root {
      --bg: #020912;
      --t0: #eaf0ff;
      --cy: #22d3ee;
    }

    html {
      background: #020912;
      color: #eaf0ff;
    }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }
  </style>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />

  <!-- SEO -->
  <title>AegisShare Enterprise — Zero-Knowledge Secure File Sharing</title>
  <meta name="description"
    content="Enterprise-grade zero-knowledge encrypted file sharing for regulated industries. GDPR, HIPAA, SOC 2 compliant." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Open Graph -->
  <meta property="og:title" content="AegisShare Enterprise" />
  <meta property="og:description" content="Zero-knowledge secure file sharing for regulated industries" />
  <meta property="og:image" content="https://app.aegisshare.io/og-image.png" />
  <meta property="og:type" content="website" />
</head>

<body>
  <div id="root"></div>
  <!-- Toast portal target -->
  <div id="toast-root"></div>
  <!-- Modal portal target -->
  <div id="modal-root"></div>
  <!-- Screen reader route announcer -->
  <div id="route-announcer" aria-live="polite" aria-atomic="true"
    style="position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
